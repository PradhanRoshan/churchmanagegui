<body style="background-color: rgba(176, 224, 230, 0.582); height: 92.9vh">
  <div class="container col-xl-10 col-xxl-8 px-4 py-5">
    <!-- <h1 class="display-4 text-center">Reset Password</h1>
  <hr class="border border-primary border-2 opacity-75"> -->
    <div class="row align-items-center g-lg-3 py-5">
      <!-- 
    <div class="col-lg-7 text-center text-lg-start">
      <h1 class="display-4 fw-bold lh-1 text-body-emphasis mb-3">Vertically centered hero sign-up form</h1>
      <p class="col-lg-10 fs-4">Below is an example form built entirely with Bootstrap’s form controls. Each required form group has a validation state that can be triggered by attempting to submit the form without completing it.</p>
    </div> -->

      <div class="col-md-10 mx-auto col-lg-8">
        <form [formGroup]="resetPswdForm" class="p-4 p-md-4 border rounded-3 bg-body-tertiary">
          <!-- <h1 class="display-4 text-center">Reset your Password</h1> -->
          <h1 class="card-title text-center pb-0 fs-1">Reset your Password</h1>
          <hr class="border border-primary border-2 opacity-75" />

          <div *ngIf="!isFormValid" class="alert alert-danger" role="alert">
            Form input is invalid. Please check the field.
          </div>
          <div *ngIf="!isUsernameValid" class="alert alert-danger" role="alert">
            User not found. Please enter correct username.
          </div>

          <div class="row">
            <div class="col">
              <div class="form-floating mb-3">
                <input formControlName="email" type="email" class="form-control" id="floatingInput"
                  placeholder="name@example.com" />
                <label for="floatingInput">Email address</label>
              </div>
            </div>
            <div class="col">
              <div class="form-floating mb-3">
                <input formControlName="username" type="text" class="form-control" id="floatingPassword"
                  placeholder="Username" />
                <label for="floatingUsername">Username</label>
              </div>
            </div>
          </div>

          <div class="row pb-2">
            <small class="col text-body-secondary">Enter a new password below.</small>
          </div>

          <div class="row">
            <div class="col">
              <div class="form-floating mb-3">
                <input formControlName="newPassword" type="password" class="form-control" id="floatingPassword"
                  placeholder="Password" />
                <label for="floatingInput">New Password</label>
              </div>
            </div>
            <div class="col">
              <div class="form-floating mb-3">
                <input formControlName="newCnfrmPassword" type="password" class="form-control" id="floatingPassword"
                  placeholder="Password" />
                <label for="floatingPassword">Confirm New Password</label>
                <div *ngIf="!isNewPasswordValid" style="color: red">
                  New Password did not match
                </div>
              </div>
            </div>
          </div>

          <!-- <div class="checkbox mb-3">
            <label>
              <input type="checkbox" value="remember-me"> Remember me
            </label>
          </div> -->
          <button (click)="onResetClicked()" class="w-100 btn btn-lg btn-primary" type="submit">
            Reset Password
          </button>
          <hr class="my-4" />
          <small class="text-body-secondary">By clicking Sign up, you agree to the terms of use.</small>
        </form>
      </div>
    </div>
  </div>
</body>
